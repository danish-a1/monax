[package]
name = "monax-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
jpeg-encoder = { version = "0.7", default-features = false }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
monax-sidecar = { path = "../monax-sidecar" }
png = "0.18"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
libc = { version = "0.2", default-features = false }
